# Seeed XIAO ESP32-C5 hardware config: dual-band (2.4/5GHz) Wi-Fi 6 support, status LED, and
# Wi-Fi/system diagnostics. Antenna switching is hardware-managed (LFD182G45DCHD277), no
# output/GPIO control needed.
# Device identity, credentials, and OTA (esphome name/friendly_name, esp32 variant, api key,
# ota, wifi ssid/password/ap) come from the ESPHome Device Builder-generated device YAML.
# BLE tracking/proxy (esp32_ble_tracker, bluetooth_proxy) is intentionally excluded — see the
# "proxy" variant for that.

esp32:
    # Explicit board ID (not just variant) for correct board-specific defaults.
    board: seeed_xiao_esp32c5
    flash_size: 8MB
    framework:
        type: esp-idf
        sdkconfig_options:
            # C5-specific: dual-band Wi-Fi 6
            CONFIG_SOC_WIFI_HE_SUPPORT: "y"
            CONFIG_ESP_WIFI_11AX_SUPPORT: "y"
            CONFIG_SOC_WIFI_SUPPORT_5G: "y"

esphome:
    includes:
        - <esp_wifi.h>
    # No on_boot needed: C5 antenna switching is hardware-managed (LFD182G45DCHD277)

logger:
    level: DEBUG
    baud_rate: 115200
    hardware_uart: USB_SERIAL_JTAG

api:
    reboot_timeout: 15min

wifi:
    domain: .local
    power_save_mode: NONE
    fast_connect: true
    enable_on_boot: true
    reboot_timeout: 10min
    band_mode: AUTO   # AUTO | 2.4GHZ | 5GHZ (ESP32-C5 only, requires ESPHome 2026.3+)
    enable_btm: true  # 802.11v BSS Transition Management (AP-coordinated roaming)
    enable_rrm: true  # 802.11k Radio Resource Management (neighbor-assisted scanning)
    ap:
        ap_timeout: 120s
    on_connect:
        then:
            - component.update: wifi_band_sensor
            - component.update: wifi_channel_sensor
    on_disconnect:
        then:
            - lambda: |-
                id(_wifi_disconnects_since_boot)++;

mdns:

# Status LED on Seeed XIAO ESP32-C5 (GPIO27, yellow USER LED)
status_led:
    pin:
        number: GPIO27

sensor:
    - platform: internal_temperature
      name: "Internal Temp"
      entity_category: diagnostic

    - platform: uptime
      name: "Uptime"
      unit_of_measurement: "h"
      accuracy_decimals: 2
      update_interval: 60s
      filters:
          - lambda: return x / 3600.0;
      entity_category: diagnostic

    - platform: wifi_signal
      id: wifi_signal_dbm
      name: "Wi-Fi RSSI"
      update_interval: 30s
      entity_category: diagnostic

    - platform: template
      name: "Wi-Fi Disconnects (since boot)"
      id: wifi_disconnects_since_boot_sensor
      entity_category: diagnostic
      accuracy_decimals: 0
      update_interval: 30s
      lambda: |-
          return id(_wifi_disconnects_since_boot);

    - platform: template
      name: "Wi-Fi Channel"
      id: wifi_channel_sensor
      entity_category: diagnostic
      accuracy_decimals: 0
      update_interval: 60s
      lambda: |-
          wifi_ap_record_t ap_info;
          if (esp_wifi_sta_get_ap_info(&ap_info) == ESP_OK) {
            return (float) ap_info.primary;
          }
          return NAN;

text_sensor:
    - platform: template
      name: "Wi-Fi Band"
      id: wifi_band_sensor
      entity_category: diagnostic
      update_interval: 60s
      lambda: |-
          wifi_ap_record_t ap_info;
          if (esp_wifi_sta_get_ap_info(&ap_info) == ESP_OK) {
            uint8_t ch = ap_info.primary;
            if (ch >= 1 && ch <= 14) {
              return {"2.4 GHz"};
            } else if (ch >= 36) {
              return {"5 GHz"};
            }
          }
          return {"Unknown"};

    - platform: wifi_info
      ip_address:
          name: "IP"
          entity_category: diagnostic
      mac_address:
          name: "MAC"
          entity_category: diagnostic
      ssid:
          name: "SSID"
          entity_category: diagnostic
      bssid:
          name: "BSSID"
          entity_category: diagnostic

button:
    - platform: restart
      name: "Restart Device"

globals:
    - id: _wifi_disconnects_since_boot
      type: int
      restore_value: no
      initial_value: '0'

time:
    - platform: sntp
      id: sntp_time
      servers:
          - 0.pool.ntp.org
          - 1.pool.ntp.org
